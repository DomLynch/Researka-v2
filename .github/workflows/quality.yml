name: Repository quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.11.7
      - run: make quality-setup
      - run: make quality
      - name: Install locked application and test dependencies
        run: uv sync --locked --extra dev
      - name: Application tests
        run: uv run --no-sync python -m pytest -q
      - name: Application and test type checks
        run: uv run --no-sync python -m mypy .
