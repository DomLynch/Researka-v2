name: Repository quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: researka_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d researka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.11.7
      - run: make quality-setup
      - run: make quality
      - name: Install locked application and test dependencies
        run: uv sync --locked --extra dev
      - name: Application tests
        run: uv run --no-sync python -m pytest -q
        env:
          TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/researka_test
      - name: Application and test type checks
        run: uv run --no-sync python -m mypy .
