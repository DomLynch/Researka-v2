[project]
name = "researka-v2"
version = "0.1.0"
description = "Backend-only autonomous publishing runtime for Researka"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135.0",
  "cryptography>=50.0.0",
  "httpx>=0.28.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.12.0",
  "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.16.0",
  "httpx2>=2.7.0",
  "pytest>=9.0.0",
  "mypy>=1.13.0",
  "requests>=2.32.0",
  "ruff>=0.8.0",
  "types-requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "contracts*", "runtime_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error:Using `httpx` with `starlette.testclient` is deprecated.*"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["alembic", "alembic.*", "cryptography", "cryptography.*", "psycopg", "psycopg.*", "sqlalchemy", "sqlalchemy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.test_runtime_core"]
disable_error_code = ["arg-type", "call-arg", "exit-return", "union-attr"]
