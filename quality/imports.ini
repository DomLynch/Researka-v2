[importlinter]
root_packages =
    apps
    runtime_core
    contracts

[importlinter:contract:core]
name = Core cannot depend on entrypoints
type = forbidden
source_modules = runtime_core
forbidden_modules = apps

[importlinter:contract:contracts]
name = Contracts cannot depend on implementations
type = forbidden
source_modules = contracts
forbidden_modules =
    runtime_core
    apps
